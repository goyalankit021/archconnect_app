name: archconnect_app
description: "ArchConnect - Commission Ledger App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State Management & UI
  flutter_riverpod: ^3.0.3
  flutter_svg: ^2.0.10
  cupertino_icons: ^1.0.8
  pinput: ^4.0.0
  form_field_validator: ^1.1.0

  # Firebase Core & Services
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  firebase_crashlytics: ^5.0.6

  # Utilities
  image_picker: ^1.0.7
  intl: ^0.19.0
  share_plus: ^7.2.1
  url_launcher: ^6.2.1
  device_info_plus: ^12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo/logo_with_name.png"
  min_sdk_android: 21